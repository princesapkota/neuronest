{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - NeuroNest</title>
  <link rel="stylesheet" href="{% static css_file %}?v=1">
  <!-- this page uses auth styles (line 164 in patient.css or line 181 in employee.css depending on portal) -->
</head>
<body>

<a href="{% url login_url_name %}" class="auth-back">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>
  Back to Login
</a>

<div class="auth-page">

  <div class="auth-logo">
    <div class="auth-logo-mark"></div>
    <span class="auth-logo-name">NeuroNest</span>
  </div>

  <form class="form" method="post">
    {% csrf_token %}

    <p id="heading">Reset Password</p>

    <p style="text-align:center;font-size:13px;color:#b8bcc6;margin-bottom:4px;line-height:1.5;">
      Enter your {{ portal_label }} account email and we'll send you a reset link.
    </p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <div class="field">
      <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
      </svg>
      <input autocomplete="off" placeholder="Account Email" class="input-field" type="email" name="email" required>
    </div>

    <div class="btn-row" style="margin-top:14px;">
      <button class="button1" type="submit">&nbsp;&nbsp;Send Reset Link&nbsp;&nbsp;</button>
    </div>

  </form>

</div>

</body>
</html>
