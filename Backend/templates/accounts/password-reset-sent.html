{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Link Sent - NeuroNest</title>
  <link rel="stylesheet" href="{% static css_file %}?v=1">
  <!-- this page uses auth styles (line 164 in patient.css or line 181 in employee.css depending on portal) -->
</head>
<body>

<a href="{% url login_url_name %}" class="auth-back">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>
  Back to Login
</a>

<div class="auth-page">

  <div class="auth-logo">
    <div class="auth-logo-mark"></div>
    <span class="auth-logo-name">NeuroNest</span>
  </div>

  <div class="form" style="text-align:center;gap:16px;">

    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24"
         style="margin:0 auto;stroke:#2f6feb;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;">
      <path d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/>
    </svg>

    <p id="heading">Check your email</p>

    <p style="font-size:13px;color:#b8bcc6;line-height:1.6;">
      If an account with that email exists in the <strong style="color:#fff;">{{ portal_label }}</strong> portal,
      a reset link has been sent. It expires in <strong style="color:#fff;">24 hours</strong>.
    </p>

    <p style="font-size:12px;color:#6b7280;line-height:1.5;">
      Didn't receive it? Check your spam folder or
      <a href="{% url login_url_name %}" style="color:#2f6feb;text-decoration:none;font-weight:600;">go back</a>
      and try again.
    </p>

  </div>

</div>

</body>
</html>
